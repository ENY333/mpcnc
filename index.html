<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d12">
<title>CNC Studio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <nav class="menubar">
    <button class="menu-btn" data-menu="file">Tệp</button>
    <button class="menu-btn" data-menu="edit">Chỉnh sửa</button>
    <button class="menu-btn" data-menu="view">Xem</button>
    <button class="menu-btn" data-menu="simulate">Mô phỏng</button>
    <button class="menu-btn" data-menu="check">Kiểm tra</button>
    <button class="menu-btn" data-menu="learn">Học CNC</button>
    <div class="menus">
      <div class="dropdown" id="menu-file"><button id="mNew">Mới</button><button id="mOpen">Mở...</button><button id="mSave">Tải G-code</button></div>
      <div class="dropdown" id="menu-edit"><button id="mClear">Xóa toàn bộ code</button><button id="mReset">Hoàn tác mô phỏng</button></div>
      <div class="dropdown" id="menu-view"><button id="mFit">Tự Fit khung 2D</button><button id="mMilling">Chế độ PHAY</button><button id="mTurning">Chế độ TIỆN</button></div>
      <div class="dropdown" id="menu-simulate"><button id="mRun">Chạy</button><button id="mPause">Tạm dừng</button><button id="mStop">Dừng</button><button id="mStep">Chạy từng bước</button></div>
      <div class="dropdown" id="menu-check"><button id="mCheck">Kiểm tra G-code</button></div>
      <div class="dropdown" id="menu-learn"><button>G00 / G01 / G02 / G03</button><button>R và CR=</button><button>I / J / K</button></div>
    </div>
  </nav>

  <!-- Functional controls remain in DOM so the simulator engine keeps working. -->
  <div class="legacy-controls" aria-hidden="true">
    <button id="newBtn"></button><button id="openBtn"></button><button id="saveBtn"></button>
    <button id="runBtn"></button><button id="pauseBtn"></button><button id="stopBtn"></button><button id="stepBtn"></button><button id="resetBtn"></button>
    <button id="millingBtn"></button><button id="turningBtn"></button><button id="fitBtn"></button>
    <select id="controller"><option value="FANUC">FANUC</option></select><span id="controllerBadge">FANUC</span><span id="modeBadge"></span><span id="viewSub"></span>
    <input id="fileInput" type="file" accept=".nc,.cnc,.gcode,.txt">
    <span id="metricLines"></span><span id="metricLength"></span><span id="metricTime"></span><span id="metricState"></span>
    <span id="mx"></span><span id="my"></span><span id="mz"></span><span id="mf"></span><span id="ms"></span><span id="mt"></span>
    <span id="statusText"></span><span id="diagCount"></span><div id="diagList"></div>
  </div>

  <main class="workspace">
    <section class="editor-panel">
      <div class="panel-head">
        <div class="tabs"><span class="tab active">program.nc</span></div>
      </div>
      <div class="editor-wrap">
        <div id="lineNumbers" class="line-numbers"></div>
        <textarea id="code" spellcheck="false" wrap="off"></textarea>
      </div>
      <div class="editor-footer"><span id="cursorInfo">Dòng 1 / 1</span><span id="dirty">● Chưa lưu</span></div>
    </section>

    <section class="view-panel">
      <div class="view-head">
        <div><strong id="viewTitle">2D</strong></div>
        <div class="coords"><b>X</b> <span id="xPos">0.000</span> &nbsp; <b id="coordYLabel">Y</b> <span id="yPos">0.000</span> &nbsp; <b>Z</b> <span id="zPos">5.000</span></div>
      </div>
      <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
      <div class="view-footer"><div class="legend"><span class="rapid"></span> G00 <span class="feed"></span> G01 <span class="cw"></span> G02 <span class="ccw"></span> G03</div></div>
    </section>
  </main>
</div>
<script src="cnc-engine.js"></script>
<script src="app.js"></script>
</body>
</html>
